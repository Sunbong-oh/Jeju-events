<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 행사 알리미</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2320;--sub:#66706b;--line:#e2e6e3;--accent:#e8731c;--accent-soft:#fdeee2;--ok:#2f7d5b;--ok-soft:#e3f2ea;--warn:#c0392b;--warn-soft:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2120;--ink:#e8ece9;--sub:#9aa39e;--line:#2d3331;--accent:#f39a52;--accent-soft:#3a2a1d;--ok:#6cc79c;--ok-soft:#1e3329;--warn:#ef7d70;--warn-soft:#3b2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
header{max-width:960px;margin:0 auto;padding:24px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5}
main{max-width:960px;margin:0 auto;padding:8px 16px 48px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--sub);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tabs{scrollbar-width:none}
.tools{flex-wrap:wrap}
.tools select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:40%}
.tools input{flex-basis:100%}
.tools input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.title{font-weight:600;font-size:16px;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;width:100%;padding:0}
.meta{font-size:12px;color:var(--sub);margin-top:2px}
.meta a{color:var(--sub)}
.meta.place{color:var(--ink)}
a.tlink{display:block;cursor:pointer;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.4}
a.tlink:hover{color:var(--accent);text-decoration:underline}
.top input.title{width:calc(100% - 28px)}
a.tgo{color:var(--accent);text-decoration:none;font-weight:600}
.card.hasp{display:grid;grid-template-columns:minmax(0,1fr) 112px;column-gap:14px}
.card.hasp>*{grid-column:1}
.card.hasp>.pwrap{grid-column:2;grid-row:1 / span 6;align-self:start}
img.poster{display:block;width:112px;max-height:170px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
@media (max-width:520px){.card.hasp{grid-template-columns:minmax(0,1fr) 84px;column-gap:10px}img.poster{width:84px;max-height:126px}}
.b.out{background:var(--bg);color:var(--sub);border:1px solid var(--line);font-size:11px;padding:1px 6px}
.eid{display:none;margin-top:6px;font-size:11px}
/* GitHub Pages 보기 전용 */
.ro .btns,.ro .row{display:none}
.ro .eid{display:block}
.ro .dates input,.ro input.title{pointer-events:none;border-color:transparent;background:none}
.badges{display:flex;gap:4px;flex-shrink:0}
.b{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b.apply{background:var(--accent-soft);color:var(--accent)}
.b.event{background:var(--ok-soft);color:var(--ok)}
.b.kid{background:#fff4c2;color:#8a6100}
@media (prefers-color-scheme:dark){.b.kid{background:#3a3218;color:#f2cf5b}}
.b.urgent{background:var(--warn-soft);color:var(--warn)}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:10px}
.dates label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.dates label span{width:30px;flex-shrink:0}
.dates input{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;flex:1}
details{margin-top:8px;font-size:13px;color:var(--sub)}
details pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.row button{font-size:13px;padding:4px 10px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
@media (max-width:520px){.top{flex-direction:column-reverse}.top>div{width:100%}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;display:none;max-width:90vw}
</style>
</head>
<body>
<header>
  <h1>제주 행사 알리미<small>4~6살 아이와 갈 만한 제주 행사</small></h1>
  <div class="btns">
    <button id="collect" class="primary">지금 수집</button>
    <button id="add">행사 직접 추가</button>
    <button id="test">텔레그램 테스트</button>
  </div>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools"><select id="zoneSel">
    <option value="near">🏙 구제주·신제주 + 시외 큰 행사</option><option value="city">구제주·신제주만</option><option value="out">시외만</option><option value="all">전체 지역</option>
  </select><select id="fitSel">
    <option value="kid">👧 아이 맞춤</option><option value="good">⭐ 추천만</option><option value="liked">🎵 음악 공연</option><option value="all">전체</option>
  </select><select id="kmSel">
    <option value="">거리 전체</option><option value="10">10km 이내</option><option value="20">20km 이내</option><option value="30">30km 이내</option>
  </select><select id="src"></select><input id="q" placeholder="제목·내용 검색"></div>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script>
const TABS = {upcoming:"다가오는 일정", nodate:"날짜 확인 필요", past:"지난 행사", hidden:"숨김"};
let events = [], tab = "upcoming", READONLY = false;
const today = new Date(new Date().toDateString());
const dday = s => s ? Math.round((new Date(s) - today) / 864e5) : null;
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3000)}
async function api(method, path, body){
  const r = await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body&&JSON.stringify(body)});
  const j = await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
}
// 다음에 다가올 날짜(정렬·분류 기준)
function nextDate(e){
  const ds=[e.apply_start,e.apply_end,e.event_start,e.event_end].filter(Boolean).filter(d=>dday(d)>=0).sort();
  return ds[0]||null;
}
const srcOf = e => (e.blog||"").split(" · ")[0];
function group(e){
  if(e.hidden) return "hidden";
  if(!e.apply_start && !e.event_start) return "nodate";
  return nextDate(e) ? "upcoming" : "past";
}
function badge(label, d, cls){
  const n=dday(d); if(n===null||n<0) return "";
  return `<span class="b ${n<=1?"urgent":cls}">${label} ${n===0?"오늘":"D-"+n}</span>`;
}
function card(e){
  const b = (e.liked&&e.fit!=="no"?`<span class="b kid">🎵</span>`:"")
    + (e.fit==="good"?`<span class="b kid">⭐ 추천</span>`:"")
    + badge("신청마감",e.apply_end||e.apply_start,"apply") + badge("행사",e.event_start,"event");
  const inp=(f)=>`<input type="date" data-f="${f}" value="${e[f]||""}">`;
  // 포스터: 누르면 크게 열림. 이미지를 못 불러오면 칸째 숨김
  const poster = e.poster ? `<a class="pwrap" href="${esc(e.poster)}" target="_blank" rel="noopener noreferrer">
      <img class="poster" src="${esc(e.poster)}" alt="포스터" loading="lazy" referrerpolicy="no-referrer"
        onerror="const c=this.closest('.card');c.classList.remove('hasp');this.parentNode.remove()"></a>` : "";
  return `<div class="card ${e.poster?"hasp":""}" data-id="${esc(e.id)}">
    ${poster}
    <div class="top"><div style="flex:1;min-width:0">
      ${READONLY&&e.url
        ? `<a class="title tlink" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title||e.post_title)}</a>`
        : `<input class="title" data-f="title" value="${esc(e.title||e.post_title)}">${e.url?` <a class="tgo" href="${esc(e.url)}" target="_blank" rel="noopener" title="원문 열기">↗</a>`:""}`}
      ${e.area?`<div class="meta place">📍 ${esc(e.area)}${e.km!=null?` · 집에서 약 ${e.km}km`:""}${e.zone==="out"?` <span class="b out">시외${e.big?" · 큰 행사":""}</span>`:""}</div>`:""}
      ${e.info?`<div class="meta">${esc(e.info)}${e.apply_end_time?` · 마감 ${esc(e.apply_end_time)}`:""}</div>`:""}
      <div class="meta">${esc(e.blog||"")} · ${esc(e.posted||"")}${e.url?` · <a href="${esc(e.url)}" target="_blank" rel="noopener">원문</a>`:""}</div>
    </div><div class="badges">${b}</div></div>
    <div class="dates">
      <label><span>신청</span>${inp("apply_start")}~${inp("apply_end")}</label>
      <label><span>행사</span>${inp("event_start")}~${inp("event_end")}</label>
    </div>
    ${e.snippet?`<details><summary>본문 발췌</summary><pre>${esc(e.snippet)}</pre></details>`:""}
    <div class="meta eid">ID: ${esc(e.id)} (overrides.json에서 고칠 때 사용)</div>
    <div class="row">
      <button data-act="hide">${e.hidden?"숨김 해제":"숨기기"}</button>
      <button data-act="send">텔레그램으로 보내기</button>
      ${e.fit!=="good"?`<button data-act="fit-good">⭐ 추천으로</button>`:""}
      ${e.fit!=="no"?`<button data-act="fit-no">아이랑 안 맞음</button>`:""}
    </div></div>`;
}
function render(){
  const q=document.getElementById("q").value.trim();
  const sel=document.getElementById("src"), cur=sel.value;
  sel.innerHTML=`<option value="">전체 출처</option>`+[...new Set(events.map(srcOf))].sort()
    .map(s=>`<option ${s===cur?"selected":""}>${esc(s)}</option>`).join("");
  const fm=document.getElementById("fitSel").value;
  const fitOk=e=>fm==="all"||(fm==="good"?e.fit==="good":fm==="liked"?e.liked&&e.fit!=="no":e.fit!=="no");
  const km=+document.getElementById("kmSel").value;
  const zm=document.getElementById("zoneSel").value;
  // 시외 = 구제주·신제주 밖(화북·외도 등 외곽 동, 조천·애월·한림·구좌 등 읍면, 서귀포시). 위치를 모르는 행사는 시내 쪽에 둔다
  const zoneOk=e=>zm==="all"||(zm==="near"?e.zone!=="out"||e.big:zm==="city"?e.zone!=="out":e.zone==="out");
  const pool=events.filter(e=>(!sel.value||srcOf(e)===sel.value)&&fitOk(e)&&zoneOk(e)&&(!km||(e.km??0)<=km));
  const counts={}; pool.forEach(e=>counts[group(e)]=(counts[group(e)]||0)+1);
  document.getElementById("tabs").innerHTML=Object.entries(TABS).map(([k,v])=>
    `<button class="tab ${k===tab?"on":""}" data-tab="${k}">${v} ${counts[k]||0}</button>`).join("");
  let xs=pool.filter(e=>group(e)===tab && (!q || (e.title+e.post_title+e.snippet+(e.info||"")).includes(q)));
  xs.sort(tab==="upcoming"?(a,b)=>nextDate(a).localeCompare(nextDate(b)):(a,b)=>(b.posted||"").localeCompare(a.posted||""));
  document.getElementById("list").innerHTML = xs.map(card).join("") || `<div class="empty">표시할 행사가 없습니다.</div>`;
}
async function load(){
  try{ events = await api("GET","/api/events"); }
  catch{ // GitHub Pages: 서버 없이 미리 만들어 둔 events.json을 보기 전용으로 띄운다
    events = await fetch("events.json",{cache:"no-store"}).then(r=>r.json());
    document.body.classList.add("ro");
    READONLY = true;
  }
  document.getElementById("kmSel").hidden = !events.some(e=>e.km!=null);
  render();
}

document.getElementById("tabs").onclick=e=>{const t=e.target.dataset.tab;if(t){tab=t;render()}};
document.getElementById("q").oninput=render;
document.getElementById("src").onchange=render;
document.getElementById("fitSel").onchange=render;
document.getElementById("zoneSel").onchange=render;
document.getElementById("kmSel").onchange=render;
document.getElementById("list").addEventListener("change",async e=>{
  const f=e.target.dataset.f, id=e.target.closest(".card")?.dataset.id; if(!f||!id) return;
  const ev=await api("PUT","/api/events/"+encodeURIComponent(id),{[f]:e.target.value||null});
  Object.assign(events.find(x=>x.id===id),ev); toast("저장됨"); render();
});
document.getElementById("list").addEventListener("click",async e=>{
  const act=e.target.dataset.act, id=e.target.closest(".card")?.dataset.id; if(!act) return;
  const ev=events.find(x=>x.id===id);
  try{
    if(act==="hide"){Object.assign(ev,await api("PUT","/api/events/"+encodeURIComponent(id),{hidden:!ev.hidden}));render()}
    if(act.startsWith("fit-")){Object.assign(ev,await api("PUT","/api/events/"+encodeURIComponent(id),{fit_override:act.slice(4)}));render();toast("판정을 바꿨습니다")}
    if(act==="send"){await api("POST","/api/send/"+encodeURIComponent(id));toast("텔레그램 전송 완료")}
  }catch(err){toast("오류: "+err.message)}
});
document.getElementById("collect").onclick=async e=>{
  e.target.disabled=true; e.target.textContent="수집 중…";
  try{const r=await api("POST","/api/collect");toast(`새 행사 ${r.new}건`+(r.log.length?" · "+r.log.at(-1):""));await load()}
  catch(err){toast("오류: "+err.message)}
  e.target.disabled=false; e.target.textContent="지금 수집";
};
document.getElementById("test").onclick=async()=>{
  try{await api("POST","/api/test-telegram");toast("테스트 메시지를 보냈습니다")}catch(err){toast("오류: "+err.message)}
};
document.getElementById("add").onclick=async()=>{
  const title=prompt("행사 이름"); if(!title) return;
  events.push(await api("POST","/api/events",{title})); tab="nodate"; render(); toast("추가됨 — 날짜를 입력하세요");
};
load();
</script>
</body>
</html>
