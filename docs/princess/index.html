<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Princess Talk Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Jua&display=swap">
<style>
:root{
  /* Layout: one-screen storybook stage. Princess and speech bubble on top, big picture cards and a mic button below. Single bright look by choice. */
  --ink:#3B2A5C; --ink-soft:#6A5890; --paper:#FFF9FE; --lilac:#EDE3FF; --line:#E5D6F5;
  --rose:#FF5E9C; --rose-deep:#D9407A; --gold:#FFC530; --mint:#2FBF94; --mint-soft:#E3FFF4;
  --font-en:'Baloo 2','Jua',ui-rounded,system-ui,sans-serif;
  --font-ko:'Jua','Baloo 2',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--lilac);color:var(--ink);font-family:var(--font-en);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Home */
.home{overflow-y:auto;padding-block:22px 32px;background:radial-gradient(circle at 20% 0%,#FFE1EF 0,transparent 45%),radial-gradient(circle at 90% 10%,#DDF1FF 0,transparent 40%),var(--lilac)}
.home-inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.home h1{margin:0;text-align:center;font-size:clamp(40px,8vw,74px);line-height:1;font-weight:800;color:var(--rose);text-shadow:0 4px 0 #fff,0 7px 0 rgba(59,42,92,.12);text-wrap:balance}
.home .sub{margin:0;text-align:center;font-family:var(--font-ko);font-size:clamp(18px,3vw,24px);color:var(--ink-soft)}
.sec{margin:8px 0 0;display:flex;align-items:baseline;gap:10px;font-size:28px;font-weight:800;color:var(--ink)}
.sec small{font-family:var(--font-ko);font-size:18px;font-weight:400;color:var(--ink-soft)}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.story{border:4px solid #fff;border-radius:28px;padding:8px 8px 14px;display:grid;justify-items:center;gap:2px;box-shadow:0 7px 0 rgba(59,42,92,.13);transition:transform .15s}
.story:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(59,42,92,.13)}
.story svg{height:150px;width:auto;max-width:100%}
.story .label{display:grid;justify-items:center;gap:2px;background:rgba(255,255,255,.88);border-radius:18px;padding:6px 12px}
.story .en{font-size:22px;font-weight:800;line-height:1.1}
.story .ko{font-family:var(--font-ko);font-size:16px;color:var(--ink-soft)}
.story .got{font-size:20px;letter-spacing:2px;color:var(--gold);min-height:24px;text-shadow:0 1px 0 rgba(59,42,92,.25)}
.tips{background:#fff;border-radius:22px;padding:14px 18px;font-family:var(--font-ko);font-size:16px;line-height:1.6;color:var(--ink)}
.tips ol{margin:6px 0 0;padding-left:22px}
.tips .engine{margin-top:8px;padding:8px 12px;border-radius:14px;background:var(--lilac)}

/* Play */
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px;background:var(--paper)}
.round{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.round svg{width:24px;height:24px}
.topbar .name{flex:1;min-width:0;font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;font-size:26px;line-height:1}
.dots span{color:var(--line)}
.dots span.on{color:var(--gold);text-shadow:0 2px 0 rgba(59,42,92,.2)}

.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bubble bubble" "princess prop";gap:6px;padding-block:12px 0}
.stage::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50%;background:rgba(255,255,255,.55);z-index:0}
.bubble{grid-area:bubble;justify-self:center;position:relative;z-index:2;background:#fff;border:none;border-radius:26px;padding:10px 18px 10px 20px;font-size:clamp(20px,3.6vh,30px);font-weight:700;line-height:1.2;max-width:680px;text-align:center;box-shadow:0 6px 0 rgba(59,42,92,.12);display:flex;align-items:center;gap:10px;text-wrap:balance}
.bubble::after{content:"";position:absolute;left:24%;bottom:-16px;border:10px solid transparent;border-top:12px solid #fff;border-bottom:0}
.btxt{display:grid;gap:2px}
#koText{font-family:var(--font-ko);font-size:clamp(14px,2.2vh,17px);font-weight:400;color:var(--ink-soft);line-height:1.35;word-break:keep-all}
.bubble .ear{flex:none;width:34px;height:34px;border-radius:50%;background:var(--lilac);display:grid;place-items:center}
.bubble .ear svg{width:20px;height:20px}
.princess-wrap{grid-area:princess;min-height:0;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center}
.princess-wrap .princess{height:100%;max-height:360px;width:auto;max-width:100%;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.princess-wrap.talking .princess{animation:bob 0.9s ease-in-out infinite}
.friend{position:absolute;right:2%;bottom:4px;font-size:clamp(40px,8vh,76px);line-height:1;animation:bob 2.6s ease-in-out infinite reverse}
.prop{grid-area:prop;min-height:0;position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:4px;font-size:clamp(56px,13vh,128px);line-height:1}
.prop.count{font-size:clamp(46px,9vh,88px)}
.prop span{animation:bob 2.8s ease-in-out infinite}
.prop span:nth-child(2){animation-delay:-.6s}.prop span:nth-child(3){animation-delay:-1.2s}

.m-open{display:none;transform-box:fill-box;transform-origin:center}
.talking .m-closed{display:none}
.talking .m-open{display:inline;animation:talk .22s ease-in-out infinite alternate}

.choices{display:flex;justify-content:center;gap:14px;padding-block:14px 6px;background:var(--paper)}
.choice{flex:1 1 0;min-width:0;max-width:230px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:8px 6px 6px;display:grid;justify-items:center;gap:0;box-shadow:0 6px 0 var(--line);transition:transform .18s,border-color .18s,background .18s}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice .pic{font-size:clamp(44px,8vh,74px);line-height:1.15;display:grid;place-items:center;min-height:1.15em}
.choice .word{font-size:clamp(22px,3.4vh,30px);font-weight:800;line-height:1.1}
.choice.reading{border-color:var(--gold);transform:translateY(-6px) scale(1.04);box-shadow:0 10px 0 #F5DFA0}
.choice.hint{border-color:var(--rose);animation:glow 1s ease-in-out infinite alternate}
.choice.correct{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 6px 0 #B9EBD8}
.swatch{width:.9em;height:.9em;border-radius:50%;border:4px solid rgba(59,42,92,.18);display:block}
.num{font-weight:800;color:var(--rose)}
.pic .mon{width:1.25em;height:1.25em;display:block}
.prop .mon{width:min(100%,1.9em);height:auto}
.prop.frozen .mon{filter:saturate(.25) brightness(1.25) drop-shadow(0 0 12px #BFE6FF)}
.prop.frozen span{animation:none}
.prop .ice{position:absolute;font-size:.45em;animation:bob 2s ease-in-out infinite}

.dock{display:flex;align-items:center;justify-content:center;gap:12px 18px;flex-wrap:wrap;padding-block:6px 14px;background:var(--paper)}
.mic{width:92px;height:92px;border-radius:50%;border:none;background:var(--rose);box-shadow:0 7px 0 var(--rose-deep);display:grid;place-items:center;position:relative;flex:none}
.mic svg{width:44px;height:44px}
.mic:disabled{background:#D9CBE8;box-shadow:0 7px 0 #BBA9D0;cursor:default}
.mic.ready::before,.mic.listening::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:5px solid var(--rose);opacity:.6;animation:ring 1.4s ease-out infinite}
.mic.listening{background:#FF3D73}
.mic.listening::before{animation-duration:.8s}
.mic-side{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:340px}
.mic-label{font-size:26px;font-weight:800;line-height:1.1}
.status{font-family:var(--font-ko);font-size:16px;color:var(--ink-soft);min-height:1.4em;overflow-wrap:anywhere}
.pass{font-family:var(--font-ko);font-size:16px;background:#fff;border:3px dashed var(--line);border-radius:999px;padding:8px 16px}

.spark{position:fixed;z-index:30;font-size:34px;color:var(--gold);pointer-events:none;text-shadow:0 2px 0 rgba(59,42,92,.2);animation:spark .9s ease-out forwards}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(59,42,92,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.done{background:#fff;border-radius:34px;padding:20px 24px 24px;text-align:center;display:grid;justify-items:center;gap:6px;max-width:420px;width:100%;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.done svg{height:200px;width:auto}
.done h2{margin:0;font-size:44px;font-weight:800;color:var(--rose);line-height:1}
.done .big-stars{font-size:40px;color:var(--gold);letter-spacing:4px}
.done .ko{font-family:var(--font-ko);font-size:18px;color:var(--ink-soft)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{border:none;border-radius:999px;padding:12px 24px;font-size:22px;font-weight:800;background:var(--rose);color:#fff;box-shadow:0 5px 0 var(--rose-deep)}
.btn.alt{background:var(--lilac);color:var(--ink);box-shadow:0 5px 0 var(--line)}

.particle{position:absolute;z-index:0;pointer-events:none;color:rgba(255,255,255,.95);line-height:1}
.particle.fall{top:-8%;animation:fall linear infinite}
.particle.rise{bottom:-8%;animation:rise linear infinite}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.15)}}
@keyframes ring{from{transform:scale(.9);opacity:.7}to{transform:scale(1.3);opacity:0}}
@keyframes glow{from{box-shadow:0 6px 0 #FFC2DA}to{box-shadow:0 6px 0 #FFC2DA,0 0 0 8px rgba(255,94,156,.25)}}
@keyframes spark{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(120vh) rotate(200deg)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-120vh)}}

@media (max-width:560px){
  .stage{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
  .mic{width:80px;height:80px}
  .mic-label{font-size:22px}
}
@media (max-height:620px){
  .princess-wrap .princess{max-height:240px}
  .choices{padding-block:8px 4px}
  .mic{width:72px;height:72px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}
  .particle{display:none}
}
</style>

<div id="app"></div>

<script>
/* ---------------- Stories (original characters) ---------------- */
const CLASSICS = [
  { id:'snowwhite', group:'classic', en:'Snow White', ko:'백설공주 (그림 형제)', friend:'🍎', fx:{ch:'✿',mode:'fall'},
    bg:'linear-gradient(180deg,#CDEBC0 0%,#F1F9E6 60%,#FFF6F0 100%)',
    p:{name:'Snow White', skin:'#FFF1EA', hair:'#231C2A', hairDark:'#120E16', dress:'#D64550', accent:'#FFFFFF', eye:'#3A2A44', crown:'#FFD95A'},
    hi:"Hello! I'm Snow White. My skin is white as snow. Let me tell you my story!",
    bye:"And we lived happily ever after! Thank you, friend! Bye-bye!",
    qs:[
      {n:"A queen has a magic mirror.", ko:"왕비에게는 말하는 마법 거울이 있었어요.",
       q:"Mirror, mirror! Who is the prettiest?", prop:'🪞', a:0, c:[
        {w:'Snow White', e:'👸', k:['snow white','snow','white','snowwhite','snow wide','no white']},
        {w:'Frog', e:'🐸', k:['frog','frogs','fog','frock']}]},
      {n:"Snow White runs into the forest. She finds a little house.", ko:"백설공주는 숲으로 도망쳐서 작은 집을 찾았어요.",
       q:"How many little men live in the house?", prop:'🏠', a:0, c:[
        {w:'Seven', num:'7', k:['seven','7','heaven','sevens','kevin']},
        {w:'Two', num:'2', k:['two','2','to','too','tu']}]},
      {n:"The bad queen brings an apple.", ko:"나쁜 왕비가 사과를 가지고 왔어요.",
       q:"What color is the apple?", prop:'🍎', a:0, c:[
        {w:'Red', col:'#E23B4A', k:['red','read','bread','rad','wed']},
        {w:'Blue', col:'#4D8DF0', k:['blue','blew','boo','bloo','glue']}]},
      {n:"Snow White eats the apple and falls asleep. A prince comes.", ko:"사과를 먹은 백설공주는 잠들었어요. 왕자님이 왔어요.",
       q:"Let's help! Say: Wake up!", prop:'😴', a:0, c:[
        {w:'Wake up!', e:'☀️', k:['wake up','wake','wakeup','weak','wait up','make up','wakey','wake wake']},
        {w:'Go to bed', e:'🛏️', k:['bed','go to bed','bad']}]},
    ]},
  { id:'sleeping', group:'classic', en:'Sleeping Beauty', ko:'잠자는 숲속의 공주 (페로·그림 형제)', friend:'🌹', fx:{ch:'❀',mode:'fall'},
    bg:'linear-gradient(180deg,#D9CCF5 0%,#F3EAFF 60%,#FFF2F6 100%)',
    p:{name:'Sleeping Beauty', skin:'#F8DCC8', hair:'#9A6A3E', hairDark:'#7A4F2A', dress:'#5FAF7A', accent:'#E6F7E9', eye:'#3F6E4E', crown:'#FFD95A'},
    hi:"Hello! I am the Sleeping Beauty. Let me tell you my story!",
    bye:"I slept for so long! Thank you, friend! Bye-bye!",
    qs:[
      {n:"A baby princess is born. Fairies bring her gifts.", ko:"아기 공주가 태어나자 요정들이 선물을 가져왔어요.",
       q:"Who brings the gifts?", prop:'👶', a:0, c:[
        {w:'Fairies', e:'🧚', k:['fairies','fairy','ferry','very','fair','berries','fairys']},
        {w:'Dogs', e:'🐶', k:['dog','dogs','doggy','dock','duck']}]},
      {n:"One bad fairy is angry. She says: You will sleep!", ko:"화가 난 나쁜 요정이 '공주는 잠들 거야!' 하고 말했어요.",
       q:"What does the princess do?", prop:'💤', a:0, c:[
        {w:'Sleep', e:'😴', k:['sleep','sleepy','slip','sleeping','seep','sleeps']},
        {w:'Run', e:'🏃', k:['run','ran','round','fun']}]},
      {n:"She sleeps for one hundred years. Roses grow all around the castle.", ko:"공주는 백 년 동안 잠들고, 성 둘레에 장미 덩굴이 자랐어요.",
       q:"What grows around the castle?", prop:'🏰', a:0, c:[
        {w:'Roses', e:'🌹', k:['rose','roses','rosie','rosy','flower','flowers','road','rows']},
        {w:'Cars', e:'🚗', k:['car','cars','ca','call','cart']}]},
      {n:"A prince comes. The princess wakes up!", ko:"왕자님이 오자 공주가 잠에서 깼어요!",
       q:"Let's say hi! Good... ?", prop:'☀️', a:0, c:[
        {w:'Good morning', e:'☀️', k:['morning','good morning','mourning','morn']},
        {w:'Good night', e:'🌙', k:['night','good night','nite','knight','goodnight']}]},
    ]},
  { id:'cinderella', group:'classic', en:'Cinderella', ko:'신데렐라 (페로)', friend:'🎃', fx:{ch:'✦',mode:'fall'},
    bg:'linear-gradient(180deg,#2E3A78 0%,#5867B0 55%,#B9C2EE 100%)',
    p:{name:'Cinderella', skin:'#F6D7C2', hair:'#4A3226', hairDark:'#33211A', dress:'#F2C14E', accent:'#FFF3C4', eye:'#4E6B8C', crown:'#E8EEF8'},
    hi:"Hello! I'm Cinderella. Let me tell you my story!",
    bye:"The shoe fits! Thank you, friend! Bye-bye!",
    qs:[
      {n:"Cinderella works all day. She cleans the floor.", ko:"신데렐라는 하루 종일 바닥을 쓸고 일했어요.",
       q:"What does she use?", prop:'🧽', a:0, c:[
        {w:'Broom', e:'🧹', k:['broom','brooms','room','bloom','vroom','groom','brom']},
        {w:'Spoon', e:'🥄', k:['spoon','spoons','soon','spoom']}]},
      {n:"A fairy godmother comes. She makes magic!", ko:"요정 할머니가 와서 마법을 부렸어요!",
       q:"What is this? It turns into a golden coach!", prop:'🪄', a:0, c:[
        {w:'Pumpkin', e:'🎃', k:['pumpkin','pumpkins','bumpkin','pumkin','punkin','pump']},
        {w:'Apple', e:'🍎', k:['apple','apples','happle','appo','apo','appa']}]},
      {n:"Cinderella dances with the prince. At midnight, she must run home!", ko:"왕자님과 춤을 추다가, 밤 12시가 되자 서둘러 집으로 달려갔어요!",
       q:"Oh no! What does she lose?", prop:'🕛', a:0, c:[
        {w:'Shoe', e:'👠', k:['shoe','shoes','show','sue','slipper','chew']},
        {w:'Hat', e:'🎩', k:['hat','hats','hot','cat','had']}]},
      {n:"The prince looks for her. The shoe fits!", ko:"왕자님이 신데렐라를 찾았어요. 구두가 꼭 맞았어요!",
       q:"Are they happy?", prop:'💖', a:0, c:[
        {w:'Yes!', e:'😊', k:['yes','yeah','yep','yay','ya','yess','yea','yup']},
        {w:'No', e:'😢', k:['no','nope','nah']}]},
    ]},
  { id:'mermaid', group:'classic', en:'The Little Mermaid', ko:'인어공주 (안데르센)', friend:'🐚', fx:{ch:'○',mode:'rise'},
    bg:'linear-gradient(180deg,#4FC3E0 0%,#2A8FC4 60%,#1D6FA8 100%)',
    p:{name:'The Little Mermaid', skin:'#FBE2D2', hair:'#8FB2F0', hairDark:'#6A8ED6', dress:'#F0889B', accent:'#FFF0B3', eye:'#2F6FA8', crown:'#FFD95A', tail:true},
    hi:"Hello! I am the little mermaid. I am the youngest daughter of the sea king.",
    bye:"Now I can walk on land! Thank you, friend! Bye-bye!",
    qs:[
      {n:"The little mermaid lives deep under the sea.", ko:"인어공주는 깊은 바닷속에 살았어요.",
       q:"She has no legs. What does she have?", prop:'🌊', a:0, c:[
        {w:'Tail', e:'🐟', k:['tail','tails','tale','tell','till','tel','tile']},
        {w:'Feet', e:'🦶', k:['feet','foot','feat','fit']}]},
      {n:"A big storm comes! A prince falls into the sea.", ko:"큰 폭풍이 와서 왕자님이 바다에 빠졌어요!",
       q:"What falls from the sky?", prop:'⛈️', a:0, c:[
        {w:'Rain', e:'🌧️', k:['rain','rainy','ran','rein','lane']},
        {w:'Candy', e:'🍬', k:['candy','candi','can','candies','andy']}]},
      {n:"She saves the prince. Now she wants to walk on land.", ko:"인어공주는 왕자님을 구해 주고, 땅 위를 걷고 싶어졌어요.",
       q:"What does she want?", prop:'🏝️', a:0, c:[
        {w:'Legs', e:'🦵', k:['leg','legs','lake','lex','eggs','lags','lacks']},
        {w:'Hat', e:'🎩', k:['hat','hats','hot','cat','had']}]},
      {n:"The sea witch gives her legs. But she takes her voice!", ko:"바다 마녀가 다리를 주었지만, 목소리를 가져갔어요!",
       q:"She can not talk. Say it for her: Hello, prince!", prop:'🤐', a:0, c:[
        {w:'Hello', e:'👋', k:['hello','hi','hallo','hullo','hey','halo','yellow','hello prince']},
        {w:'Bye', e:'💤', k:['bye','by','buy','bye bye','bay']}]},
    ]},

/* ---------------- Voice out ---------------- */
let tts = null, synthVoice = null, runId = 0;
const synth = window.speechSynthesis || null;
function pickVoice(){
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  const pref = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Moira','Tessa','Zira','Female'];
  synthVoice = pref.map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function stopSpeech(){
  try { synth && synth.cancel(); } catch {}
  try { tts && tts.stop(); } catch {}
  setTalking(false);
}
function speakSynth(text, who){
  return new Promise(res => {
    if (!synth) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (synthVoice) u.voice = synthVoice;
    u.rate = who === 'word' ? 0.75 : 0.85;
    u.pitch = who === 'princess' ? 1.3 : who === 'narrator' ? 1.05 : 1.1;
    let done = false; const fin = () => { if(!done){ done = true; clearTimeout(t); res(); } };
    const t = setTimeout(fin, 1800 + text.length * 110);
    u.onend = fin; u.onerror = fin;
    synth.speak(u);
  });
}
async function say(text, who='princess'){
  const my = runId;
  if (who === 'princess' || who === 'narrator') setTalking(true);
  try {
    if (tts) {
      try { await tts.speak(text, {voice: who==='princess' || who==='narrator' ? 'airy' : 'buttery', language:'en', rate: who==='word' ? 0.8 : 0.9}); }
      catch (e) { if (my === runId && e && e.code !== 'viewer_stopped') await speakSynth(text, who); }
    } else {
      await speakSynth(text, who);
    }
  } finally { if (my === runId) setTalking(false); }
}
function setTalking(on){ const w = $('.princess-wrap'); if (w) w.classList.toggle('talking', on); }

/* ---------------- Voice in ---------------- */
let dict = null, dictLang = true, dictRoute = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let engine = SR ? 'native' : 'none';
let engineChecked = !window.claude;

function attachClaude(){
  if (!window.claude || !window.claude.use) return;
  claude.use('tts').then(t => { if (t) tts = t; }).catch(() => {});
  claude.use('dictation').then(d => {
    if (d) {
      dict = d; engine = 'dict';
      d.onPartial(e => dictRoute && dictRoute.partial(e.text));
      d.onFinal(e => dictRoute && dictRoute.final(e.text));
      d.onState(e => dictRoute && dictRoute.state(e.state, e.reason));
    } else if (inFrame()) {
      engine = 'none';
    }
  }).catch(() => { if (inFrame()) engine = 'none'; })
    .finally(() => { engineChecked = true; renderEngineNote(); updatePass(); });
}
function inFrame(){ try { return window.self !== window.top; } catch { return true; } }

function listen(onHeard){
  if (engine === 'dict') return listenDict(onHeard);
  if (engine === 'native') return listenNative(onHeard);
  return Promise.resolve({texts:[], err:'none'});
}
function listenDict(onHeard){
  return new Promise(resolve => {
    let finals = [], partial = '', done = false, limit = null;
    const finish = err => { if (done) return; done = true; clearTimeout(limit); dictRoute = null;
      resolve({texts:[finals.join(' '), partial].filter(Boolean), err}); };
    dictRoute = {
      partial: x => { partial = x; onHeard((finals.join(' ') + ' ' + x).trim()); if (x && heardCorrect([x])) dict.stop().catch(()=>{}); },
      final: x => { finals.push(x.trim()); partial = ''; onHeard(finals.join(' ')); dict.stop().catch(()=>{}); },
      state: (s, reason) => {
        if (s === 'listening' && !limit) limit = setTimeout(() => dict.stop().catch(()=>{}), 7000);
        if (s === 'idle') finish(['not_granted','unavailable','upstream_error','rate_limited','dismissed'].includes(reason) ? reason : null);
      },
    };
    dict.start(dictLang ? {language:'en'} : undefined).catch(e => {
      const code = (e && e.code) || 'upstream_error';
      if (code === 'unavailable' && dictLang) { dictLang = false; finish('retry'); return; }
      finish(code);
    });
  });
}
function listenNative(onHeard){
  return new Promise(resolve => {
    let r; try { r = new SR(); } catch { engine = 'none'; return resolve({texts:[], err:'none'}); }
    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
    const alts = new Set(); let err = null, done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(t); resolve({texts:[...alts], err}); };
    r.onresult = e => {
      for (const res of e.results) for (let i=0;i<res.length;i++) alts.add(res[i].transcript);
      onHeard(e.results[e.results.length-1][0].transcript);
      if (heardCorrect([...alts])) { try { r.stop(); } catch {} }
    };
    r.onerror = e => { err = e.error; };
    r.onend = finish;
    const t = setTimeout(() => { try { r.stop(); } catch {} setTimeout(finish, 1500); }, 7000);
    try { r.start(); } catch { err = 'start'; finish(); }
  });
}
let stopListening = () => {
  try { dict && dict.active() && dict.stop(); } catch {}
};

/* ---------------- Matching ---------------- */
const norm = s => ' ' + String(s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
const hasKey = (text, k) => norm(text).includes(' ' + k + ' ');
function matchIdx(texts){
  for (let i=0;i<G.q.c.length;i++) if (texts.some(t => G.q.c[i].k.some(k => hasKey(t, k)))) return i;
  return -1;
}
function heardCorrect(texts){
  if (!G.q) return false;
  if (G.q.open){ const i = matchIdx(texts); if (i >= 0) G.pick = i; return i >= 0; }
  const right = G.q.c[G.q.a];
  return texts.some(t => right.k.some(k => hasKey(t, k)));
}
function heardWrong(texts){
  if (!G.q || G.q.open) return null;
  for (let i=0;i<G.q.c.length;i++){ if (i === G.q.a) continue;
    if (texts.some(t => G.q.c[i].k.some(k => hasKey(t, k)))) return G.q.c[i]; }
  return null;
}

async function askQuestion(first){
  const s = G.story; const raw = s.qs[G.qi]; const q = raw.by ? raw.by[G.branch] : raw; G.q = q; G.tries = 0; G.busy = false; G.pick = -1;

  else if (typeof q.prop === 'object'){ prop.className = 'prop count'; prop.innerHTML = Array.from({length:q.prop.n}, () => `<span>${q.prop.e}</span>`).join(''); }
  else { prop.className = 'prop'; prop.innerHTML = `<span>${q.prop}</span>`; }
  $('#choices').innerHTML = G.order.map(i => `<button class="choice" data-i="${i}" aria-label="${esc(q.c[i].w)}">${choiceHTML(q.c[i])}</button>`).join('');
  $('#choices').querySelectorAll('.choice').forEach(b => b.onclick = () => tapChoice(+b.dataset.i, b));

}

async function readQuestion(withChoices){
  const my = ++runId; stopSpeech();
  setMic('wait');
  await say(G.q.q);
  if (my !== runId) return;
  {
    for (let n=0;n<G.order.length;n++){
      const i = G.order[n];
      const card = $(`.choice[data-i="${i}"]`);
      if (!card || my !== runId) return;
      card.classList.add('reading');
      await say(n === G.order.length-1 && G.order.length > 1 ? 'or… ' + G.q.c[i].w : G.q.c[i].w, 'word');
      card.classList.remove('reading');
      if (my !== runId) return;
      await wait(250);
    }
  }
  if (my !== runId) return;
  setMic('ready');
}

async function tapChoice(i, card){
  if (G.listening || G.busy) return;
  const my = ++runId; stopSpeech(); G.lastTap = i;
  document.querySelectorAll('.choice.reading').forEach(c => c.classList.remove('reading'));
  card.classList.add('reading');
  await say(G.q.c[i].w, 'word');

}

function setMic(mode){
  const mic = $('#mic'), label = $('#micLabel'); if (!mic) return;
  mic.className = 'mic'; mic.disabled = false; mic.innerHTML = ICON.mic;
  if (mode === 'wait'){ label.textContent = 'Listen…'; }
  if (mode === 'ready'){ mic.classList.add('ready'); label.textContent = engine === 'none' ? 'Say it!' : 'Your turn!'; }
  if (mode === 'listening'){ mic.classList.add('listening'); mic.innerHTML = ICON.stop; label.textContent = "I'm listening…"; }
  if (mode === 'busy'){ mic.disabled = true; label.textContent = ''; }
}
function setStatus(t){ const el = $('#status'); if (el) el.textContent = t; }
function updatePass(){ const b = $('#pass'); if (b) b.hidden = !(G.q && (engine === 'none' || G.tries >= 1)); }

function onMic(){
  if (G.busy) return;
  if (G.listening){ stopListening(); return; }
  runId++; stopSpeech();
  document.querySelectorAll('.choice.reading').forEach(c => c.classList.remove('reading'));
  if (engine === 'none'){
    setStatus('아이가 말한 뒤 “잘 말했어요 ✓”를 눌러 주세요.');
    updatePass(); return;
  }
  G.listening = true; setMic('listening'); setStatus('듣고 있어요…');
  const myQ = G.q;
  const p = listen(t => setStatus('들린 말: ' + t));
  stopListening = () => { try { dict && dict.active() && dict.stop(); } catch {} };
  p.then(r => { G.listening = false; if (G.q === myQ) handleHeard(r); });
}

async function handleHeard({texts, err}){
  if (err === 'retry'){ setMic('ready'); setStatus('한 번 더 눌러 주세요.'); return; }
  if (['not-allowed','service-not-allowed','not_granted','unavailable','audio-capture','none'].includes(err)){
    engine = 'none'; setMic('ready');
    setStatus('마이크를 쓸 수 없어요. 아이가 말한 뒤 “잘 말했어요 ✓”를 눌러 주세요.');
    updatePass(); return;
  }
  if (heardCorrect(texts)) return success(false);
  G.tries++; updatePass();
  if (G.q.open){
    const heard0 = texts.filter(Boolean)[0];
    setStatus(heard0 ? '들린 말: ' + heard0 : '잘 안 들렸어요.');
    document.querySelectorAll('.choice').forEach(c => c.classList.add('hint'));
    const my0 = ++runId; setMic('wait');
    await say('Pick one! Say: ' + G.order.map(i => G.q.c[i].w).join(', or ') + '!');
    if (my0 === runId) setMic('ready');
    return;
  }
  const right = G.q.c[G.q.a];
  const wrong = heardWrong(texts);
  const heard = texts.filter(Boolean)[0];
  setStatus(heard ? '들린 말: ' + heard : '잘 안 들렸어요.');
  const card = $(`.choice[data-i="${G.q.a}"]`); card && card.classList.add('hint');
  const my = ++runId; setMic('wait');
  if (wrong) await say(`${wrong.w}? Hmm, look again! Say: ${right.w}!`);
  else if (!heard) await say(`I can't hear you. Say it loud! ${right.w}!`);
  else await say(`Almost! Listen. ${right.w}! Now you say it!`);
  if (my === runId) setMic('ready');
}

async function success(byParent){
  if (G.busy) return; G.busy = true;
  const my = ++runId; stopSpeech(); stopListening();
  if (G.q.open && G.pick < 0) G.pick = G.lastTap >= 0 ? G.lastTap : G.order[0];
  const ri = G.q.open ? G.pick : G.q.a;
  const right = G.q.c[ri];
  if (right.branch) G.branch = right.branch;
  document.querySelectorAll('.choice.hint').forEach(c => c.classList.remove('hint'));
  if (G.q.freeze){ const pr = $('#prop'); pr.classList.add('frozen'); pr.insertAdjacentHTML('beforeend', '<span class="ice" style="left:10%;top:10%">❄️</span><span class="ice" style="right:10%;bottom:15%">❄️</span>'); }
  const card = $(`.choice[data-i="${ri}"]`);
  if (card){ card.classList.remove('hint'); card.classList.add('correct'); burst(card); }
  G.stars++;
  const dot = $('#dots').children[G.qi]; dot && dot.classList.add('on');
  setMic('busy'); $('#pass').hidden = true;
  setStatus(byParent ? '' : '정답이에요!');
  const line = G.q.open ? `${right.w}! Let's go get him!` : G.q.freeze ? `Freeze! He is ice now! ${PRAISE[Math.floor(Math.random()*PRAISE.length)]}` : `${right.w.replace('!','')}! ${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`;
  $('#bubbleText').textContent = line;
  await say(line);
  if (my !== runId) return;
  await wait(500);
  if (my !== runId) return;
  G.qi++; G.lastTap = -1;
  if (G.qi < G.story.qs.length) askQuestion(false);
  else finishStory();
}

function burst(el){
  const r = el.getBoundingClientRect();
  for (let i=0;i<10;i++){
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = '★';
    const a = (i/10)*Math.PI*2;
    s.style.left = (r.left + r.width/2 - 15) + 'px'; s.style.top = (r.top + r.height/2 - 20) + 'px';
    s.style.setProperty('--dx', Math.cos(a)*110 + 'px'); s.style.setProperty('--dy', Math.sin(a)*110 + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}

async function finishStory(){
  const s = G.story; const my = ++runId;
  const done = loadDone(); done[s.id] = Math.max(done[s.id]||0, G.stars); saveDone(done);
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="done">
    <div class="princess-wrap">${princessSVG(s.p)}</div>
    <h2>You did it!</h2>
    <div class="big-stars">${'★'.repeat(G.stars)}</div>
    <div class="ko">${esc(s.ko)} 이야기를 끝냈어요!</div>
    <div class="btns"><button class="btn" id="again">Again</button><button class="btn alt" id="toHome">Home</button></div>
  </div>`;
  app.appendChild(ov);
  const idx = STORIES.indexOf(s);
  $('#again').onclick = () => startStory(idx);
  $('#toHome').onclick = renderHome;
  await say(s.bye);
}

renderHome();
attachClaude();
</script>
